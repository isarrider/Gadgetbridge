# Fork-only: builds a Gadgetbridge APK on GitHub for testing. Not meant for upstream (Codeberg).
#
# Start it from the Actions tab ("Build APK" > "Run workflow") and enter the branch to build.
# The workflow file only has to exist on master; the branch being built does not need it.
#
# Builds the "mainline nightly" variant (app ID nodomain.freeyourgadget.gadgetbridge.nightly),
# which installs next to a regular Gadgetbridge instead of replacing it.
#
# Signing: set these repository secrets so every build is signed with the same key and can be
# installed as an update over the previous one:
#   NIGHTLY_KEYSTORE_BASE64  base64 of a PKCS12 keystore
#   NIGHTLY_KEYSTORE_PASSWORD
#   NIGHTLY_KEY_ALIAS
#   NIGHTLY_KEY_PASSWORD
# Without them the APK is signed with a throwaway debug key that changes on every run.

name: Build APK

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build
        required: true
        default: master

permissions:
  contents: read

concurrency:
  group: build-apk-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out ${{ inputs.ref }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.NIGHTLY_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nightly.p12"
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No NIGHTLY_KEYSTORE_BASE64 secret, signing with a throwaway debug key. This APK cannot be installed as an update over a previous build."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build mainline nightly APK
        env:
          GRADLE_OPTS: -Dorg.gradle.vfs.watch=true
          KEYSTORE_PASSWORD: ${{ secrets.NIGHTLY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NIGHTLY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NIGHTLY_KEY_PASSWORD }}
        run: |
          if [ "${{ steps.signing.outputs.present }}" = "true" ]; then
            ./gradlew assembleMainlineNightly --stacktrace \
              -Dnightly_store_file="$RUNNER_TEMP/nightly.p12" \
              -Dnightly_store_password="$KEYSTORE_PASSWORD" \
              -Dnightly_key_alias="$KEY_ALIAS" \
              -Dnightly_key_password="$KEY_PASSWORD"
          else
            ./gradlew assembleMainlineNightly --stacktrace
          fi

      - name: Name artifact
        id: name
        env:
          REF: ${{ inputs.ref }}
        run: |
          echo "artifact=gadgetbridge-nightly-$(echo "$REF" | tr -c 'A-Za-z0-9._\n-' '-')-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: app/build/outputs/apk/mainline/nightly/*.apk
          if-no-files-found: error
